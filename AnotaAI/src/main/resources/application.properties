spring.application.name=AnotaAI

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/anotaai}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=${PORT:8080}


gmail.api.client-id=${GMAIL_CLIENT_ID:}
gmail.api.client-secret=${GMAIL_CLIENT_SECRET:}
gmail.api.refresh-token=${GMAIL_REFRESH_TOKEN:}
gmail.api.sender-email=${GMAIL_SENDER_EMAIL:}
