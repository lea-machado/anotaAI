
spring.application.name=AnotaAI
spring.config.import=
spring.data.mongodb.uri=
spring.data.mongodb.database=${MONGODB_DATABASE:anotaai}
spring.data.mongodb.uuid-representation=standard
spring.data.mongodb.auto-index-creation=true




server.port=${PORT:8080}


gmail.api.client-id=${GMAIL_CLIENT_ID:}
gmail.api.client-secret=${GMAIL_CLIENT_SECRET:}
gmail.api.refresh-token=${GMAIL_REFRESH_TOKEN:}
gmail.api.sender-email=${GMAIL_SENDER_EMAIL:}




openrouter.api-key=${OPENROUTER_API_KEY:}
openrouter.model=${OPENROUTER_MODEL:}
app.public-url=${ANOTAAI_PUBLIC_URL:https://anotaai-ctsf.onrender.com}


ia.limite.tokens-por-periodo=${IA_TOKENS_POR_PERIODO:50000}
ia.limite.periodo-segundos=${IA_PERIODO_SEGUNDOS:86400}
ia.limite.max-tokens-saida=${IA_MAX_TOKENS_SAIDA:4096}
